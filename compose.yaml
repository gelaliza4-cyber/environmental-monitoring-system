
services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: envuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: environmental_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envuser -d environmental_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  importer:
    build: .
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: environmental_db
      DB_USER: envuser
      DB_PASSWORD: ${DB_PASSWORD}
      CSV_FILE: sample_sensor_data.csv
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
